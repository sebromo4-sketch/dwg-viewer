name: CI
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [20, 22] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build:all
      - run: npm run package:skill
      - name: Run the packaged skill CLI (no node_modules)
        run: |
          mkdir /tmp/skill && cp -r skills/dwg-viewer /tmp/skill/
          cd /tmp && node skill/dwg-viewer/scripts/dwg-tool.mjs info "$GITHUB_WORKSPACE/samples/test3d_AC1032.dwg" | head -20
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: dist
          path: |
            dist/dwg-viewer.html
            dist/dwg-viewer-es.html
            dist/dwg-viewer-skill.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build:all && npm run package:skill
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dwg-viewer.html
            dist/dwg-viewer-es.html
            dist/dwg-viewer-skill.zip
          generate_release_notes: true
